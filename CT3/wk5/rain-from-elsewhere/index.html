<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain from Elsewhere</title>
<style>
  :root {
    --glass: rgba(14, 18, 22, 0.42);
    --glass-hi: rgba(14, 18, 22, 0.5);
    --line: rgba(255, 255, 255, 0.14);
    --ink: #f3f5f4;
    --dim: rgba(243, 245, 244, 0.6);
    --faint: rgba(243, 245, 244, 0.5);
    --accent: #a8f0e6;
    --rec: #ff6b6b;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e10; color: var(--ink);
    font-family: var(--sans); font-size: 11.5px; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s var(--ease); }
  #ui.hidden { opacity: 0; }
  #ui.hidden * { pointer-events: none !important; }
  .panel { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .18); }
  .label { font-size: 9px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

  /* title */
  .title { position: absolute; left: 28px; top: 24px; text-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 24px rgba(0,0,0,.35); }
  .title h1 { margin: 0; font-weight: 500; font-size: 22px; letter-spacing: -.015em; line-height: 1; }
  .title h1 em { font-style: normal; font-weight: 300; color: var(--accent); }
  .about-link { display: inline-block; margin-top: 12px; pointer-events: auto; color: var(--ink); font-size: 11px; font-weight: 500; letter-spacing: .02em;
    text-decoration: none; padding: 6px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .about-link:hover { background: var(--glass-hi); }
  .title p { margin: 8px 0 0; font-size: 9px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

  /* source list */
  .sources { position: absolute; right: 24px; top: 24px; width: 236px; padding: 14px 10px 10px; }
  .sources .label { padding: 0 8px 10px; display: flex; justify-content: space-between; }
  .sources ul { list-style: none; margin: 0; padding: 0; }
  .sources li + li { margin-top: 2px; }
  .src { width: 100%; display: grid; grid-template-columns: 1fr 54px 38px; align-items: center; gap: 8px;
    padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink);
    font: inherit; text-align: left; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease); }
  .src:hover { background: rgba(255,255,255,.07); }
  .src .name { font-size: 13.5px; font-weight: 400; letter-spacing: -.005em; line-height: 1; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .src .bar { height: 2px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  .src .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1.2s var(--ease); }
  .src .mm { text-align: right; color: var(--dim); font-size: 10px; }
  .src .pick { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity .4s; }
  .src.picked .pick { opacity: 1; }
  .src.active { background: rgba(243,245,244,.92); color: #11161a; }
  .src.active .mm { color: rgba(17,22,26,.6); }
  .src.active .bar { background: rgba(17,22,26,.12); }
  .src.active .bar i { background: #11161a; }
  .src.auto { grid-template-columns: 1fr auto; margin-bottom: 6px; border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; padding-bottom: 10px; }
  .src.auto.active { border-radius: 8px; border-bottom-color: transparent; }
  .src.auto .mm { font-size: 9.5px; letter-spacing: .04em; }
  .sources .note { padding: 8px 8px 2px; color: var(--faint); font-size: 9.5px; line-height: 1.5; min-height: 0; }

  .surface { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .surface .label { padding: 0 8px 8px; }
  .surface .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; color: var(--dim); }
  .surface .row input { width: 110px; }
  .floor { width: 100%; text-align: left; padding: 7px 8px; margin-bottom: 2px; border: 0; border-radius: 8px; background: transparent; color: var(--ink);
    font: inherit; cursor: pointer; transition: background .3s var(--ease); }
  .floor:hover { background: rgba(255,255,255,.07); }
  /* readout */
  .readout { position: absolute; left: 24px; bottom: 24px; width: 420px; padding: 16px 18px 14px; }
  .city { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 14px; }
  .city #roCity { font-size: 42px; font-weight: 300; line-height: .95; letter-spacing: -.03em; }
  .city .time { font-size: 12px; color: var(--dim); letter-spacing: .01em; }
  .stats { display: grid; grid-template-columns: 0.9fr 1fr 1.3fr 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats .k { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
  .stats .v { font-size: 13px; font-weight: 400; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .stats svg { width: 12px; height: 12px; transition: transform 1.6s var(--ease); }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 9.5px; color: var(--faint); letter-spacing: .04em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #e9c46a; box-shadow: 0 0 0 0 rgba(168,240,230,.6); }
  .dot.live { background: var(--accent); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(168,240,230,.55); } 70% { box-shadow: 0 0 0 7px rgba(168,240,230,0); } 100% { box-shadow: 0 0 0 0 rgba(168,240,230,0); } }
  .swap { animation: swap .9s var(--ease); }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

  /* tools */
  .tools { position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 4px; padding: 6px; }
  .tools button { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 0; border-radius: 9px;
    background: transparent; color: var(--ink); font: inherit; letter-spacing: .02em; cursor: pointer; transition: background .25s var(--ease), opacity .25s; }
  .tools button:hover:not(:disabled) { background: rgba(255,255,255,.09); }
  .tools button:disabled { opacity: .35; cursor: default; }
  .tools button.on { background: rgba(243,245,244,.92); color: #11161a; }
  .tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .recdot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  button.on .recdot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .slider { display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 72px; height: 2px; background: rgba(255,255,255,.2); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); cursor: pointer; }

  .hint { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); font-size: 10px; letter-spacing: .08em; color: var(--ink);
    text-shadow: 0 1px 12px rgba(0,0,0,.5); opacity: .8; transition: opacity 1.2s var(--ease); white-space: nowrap; }
  .hint.gone { opacity: 0; }
  .toast { position: absolute; left: 50%; bottom: 92px; transform: translate(-50%, 8px); padding: 9px 14px; font-size: 10.5px; opacity: 0;
    transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 40px; font-size: 13px; line-height: 1.7; }

  @media (max-width: 900px) {
    .readout { width: calc(100vw - 48px); bottom: 84px; }
    .sources { display: none; }
    .tools { left: 24px; right: 24px; overflow-x: auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <header class="title">
    <h1>Rain <em>from</em> Elsewhere</h1>
    <p>A water surface moved by live rainfall</p>
    <a class="about-link" href="about.html">About the project →</a>
  </header>

  <aside class="panel sources">
    <div class="label"><span>Rain source</span><span>mm</span></div>
    <ul id="cityList"></ul>
    <div class="note" id="autoNote"></div>
    <div class="surface">
      <div class="label"><span>Surface</span></div>
      <button class="floor" id="bFloor" title="Switch the built-in floor (F)">Floor · Mint</button>
      <label class="row">Refraction <input id="sRefr" type="range" min="0" max="1" step="0.01" value="0.55"></label>
      <label class="row">Sparkle <input id="sSpark" type="range" min="0" max="2" step="0.01" value="1"></label>
      <label class="row">Grain <input id="sGrain" type="range" min="0" max="1" step="0.01" value="0.2"></label>
    </div>
  </aside>

  <section class="panel readout">
    <div class="label" id="roLabel">Now falling from</div>
    <div class="city"><span id="roCity">—</span><span class="time" id="roTime">--:--</span></div>
    <div class="stats">
      <div><span class="k">Precip</span><span class="v" id="roPrecip">—</span></div>
      <div><span class="k">Wind</span><span class="v">
        <svg id="roArrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 10.5V1.5M2.5 5 6 1.5 9.5 5"/></svg>
        <span id="roWind">—</span></span></div>
      <div><span class="k">Sky</span><span class="v" id="roSky">—</span></div>
      <div><span class="k">Light</span><span class="v" id="roLight">—</span></div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting to Open-Meteo…</span></div>
  </section>

  <nav class="panel tools">
    <button id="bRec" title="Record video (R)"><span class="recdot"></span><span id="bRecLabel">Record</span></button>
    <button id="bLayers" title="Capture time-as-height layers (L)">Capture layers</button>
    <button id="bExport" title="Export stacked layers as .obj (E)" disabled>Export 3D</button>
    <span class="sep"></span>
    <button id="bPhoto" title="Load your own photo (O) — or drop it on the page">Photo</button>
  </nav>

  <div class="hint" id="hint">Click or drag to touch the water &nbsp;·&nbsp; H hides the interface</div>
  <div class="panel toast" id="toast"></div>
</div>
<div id="err"></div>
<input id="file" type="file" accept="image/*" hidden>

<script>
/* ==========================================================================
   RAIN FROM ELSEWHERE
   --------------------------------------------------------------------------
   FIELD    a water surface (height + velocity) simulated on the GPU
            with the 2D wave equation. Rain drops push the surface down,
            ripples spread, cross, reflect and slowly settle.
   TEXTURE  your photo lies under the water. The slope of the surface
            refracts it (with slight RGB dispersion), and a fine grain
            layer is bent by the same refraction, so it flows with the water.
   INPUT    live precipitation + wind from Open-Meteo for a chosen city,
            or "Auto": whichever city is raining hardest right now.
            precipitation -> how often and how hard drops fall
            wind          -> drift of the surface + a constant fine ruffle
   OUTPUT   video recording (with a caption burned in), and time-as-height:
            wave crests are captured layer by layer and stacked into a
            3D object (.obj) — each drop becomes a cone of expanding rings.
   ========================================================================== */

// ---------- cities ----------
const CITIES = [
  { id: 'chengdu',   name: 'Chengdu',     lat: 30.67, lon: 104.07 },
  { id: 'la',        name: 'Los Angeles', lat: 34.05, lon: -118.24 },
  { id: 'london',    name: 'London',      lat: 51.51, lon: -0.13 },
  { id: 'seattle',   name: 'Seattle',     lat: 47.61, lon: -122.33 },
  { id: 'tokyo',     name: 'Tokyo',       lat: 35.68, lon: 139.69 },
  { id: 'singapore', name: 'Singapore',   lat: 1.35,  lon: 103.82 },
  { id: 'hongkong',  name: 'Hong Kong',   lat: 22.32, lon: 114.17 },
  { id: 'bergen',    name: 'Bergen',      lat: 60.39, lon: 5.32 },
];
const REFRESH_MIN = 10;

// ---------- tunables ----------
const P = {
  simScale: 0.5,       // simulation resolution relative to CSS pixels
  stepsPerFrame: 2,    // wave steps per frame (wave speed)
  damping: 0.9982,     // closer to 1 = ripples travel further
  refraction: 0.55,    // UI slider
  dispersion: 0.18,    // RGB split during refraction
  grain: 0.2,          // UI slider
  specular: 0.55,      // glints on the ripples
  sparkle: 1.0,        // the twinkling stars in sunlight
  ease: 0.012,         // how slowly data changes are eased in (per frame)
};

// ---------- WebGL setup ----------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
function fail(msg) { const e = document.getElementById('err'); e.style.display = 'grid'; e.textContent = msg; throw new Error(msg); }
if (!gl) fail('This piece needs WebGL2. Try a recent Chrome, Safari or Firefox.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('This GPU cannot render to float textures (EXT_color_buffer_float).');
const FLOAT_LINEAR = !!gl.getExtension('OES_texture_float_linear');

const VERT = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const NOISE = `
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x), mix(hash(i + vec2(0,1)), hash(i + 1.0), u.x), u.y); }`;

// wave equation step: r = height, g = velocity
const SIM_FRAG = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D s;
uniform vec2 texel;
uniform float aspect, damping, time, ruffle;
uniform vec2 drift;                 // wind drift, in texels per step
uniform int dropCount;
uniform vec4 drops[16];             // x, y, radius (in screen-height units), strength
${NOISE}
void main(){
  vec2 q = uv - drift * texel;      // advect: the whole surface slides downwind
  vec4 c = texture(s, q);
  // isotropic 9-point neighbourhood, so ripples stay perfectly round
  float sides = texture(s, q + vec2(texel.x, 0)).r + texture(s, q - vec2(texel.x, 0)).r
              + texture(s, q + vec2(0, texel.y)).r + texture(s, q - vec2(0, texel.y)).r;
  float corners = texture(s, q + texel).r + texture(s, q - texel).r
                + texture(s, q + vec2(texel.x, -texel.y)).r + texture(s, q + vec2(-texel.x, texel.y)).r;
  float avg = (4.0 * sides + corners) / 20.0;
  c.g += (avg - c.r) * 2.0;
  c.g *= damping;

  // wind ruffle: a slow travelling noise that keeps nudging the surface
  vec2 w = uv * vec2(aspect, 1.0) * 14.0 - drift * time * 0.9;
  c.g += (vnoise(w) + 0.5 * vnoise(w * 2.3 + 11.0) - 0.75) * ruffle;

  c.r += c.g;
  c.r *= 0.9996;

  // rain drops: a soft cosine dent, never a single pixel
  for (int i = 0; i < 16; i++) {
    if (i >= dropCount) break;
    vec4 d = drops[i];
    float dist = length((uv - d.xy) * vec2(aspect, 1.0)) / d.z;
    if (dist < 1.0) c.r -= d.w * (0.5 + 0.5 * cos(3.14159265 * dist));
  }
  o = c;
}`;

// final image: refract the photo through the surface
const RENDER_FRAG = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D s, photo;
uniform vec2 texel, res;
uniform float aspect, photoAspect, refr, disp, grain, spec;
uniform float sun, warmth, cloud, night;   // live light
uniform float time, dpr, sparkle, starAmt;
uniform sampler2D G, B1, B2, B3, B4, ST;     // glints, bloom levels, streaks
uniform vec3 sunDir;                        // points toward the sun (x east, y north, z up)
${NOISE}
vec2 cover(vec2 u){
  vec2 k = aspect > photoAspect ? vec2(1.0, photoAspect / aspect) : vec2(aspect / photoAspect, 1.0);
  return (u - 0.5) * k + 0.5;
}

// ---- sunlit caustics: warped Voronoi edges, the dancing light net on a pool floor ----
vec2 hash2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float voroEdge(vec2 p, float t){
  vec2 i = floor(p), f = fract(p); float d1 = 8.0, d2 = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y), o = hash2(i + g);
    o = 0.5 + 0.42 * sin(t + 6.2831 * o);
    float d = length(g + o - f);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
  }
  return d2 - d1;
}
float caustics(vec2 p, float t){
  vec2 w = p + 0.75 * vec2(vnoise(p * 0.9 + t * 0.12), vnoise(p * 0.9 - t * 0.1 + 5.2)) + 0.18 * vec2(vnoise(p * 2.6 - t * 0.2), vnoise(p * 2.6 + 9.0));
  float e1 = voroEdge(w, t * 0.55);
  float e2 = voroEdge(w * 1.7 + 3.1, -t * 0.45);
  // thin bright cores with a soft glow, and patches where the net is stronger or weaker
  float c = exp(-e1 * e1 * 260.0) * 0.75 + exp(-e1 * 16.0) * 0.25
          + 0.4 * (exp(-e2 * e2 * 420.0) * 0.7 + exp(-e2 * 22.0) * 0.3);
  float patchy = smoothstep(0.15, 0.85, vnoise(p * 0.28 + vec2(t * 0.04, -t * 0.03)));
  return c * (0.35 + 0.65 * patchy);
}

void main(){
  float h  = texture(s, uv).r;
  float hL = texture(s, uv - vec2(texel.x, 0)).r, hR = texture(s, uv + vec2(texel.x, 0)).r;
  float hD = texture(s, uv - vec2(0, texel.y)).r, hU = texture(s, uv + vec2(0, texel.y)).r;
  vec3 n = normalize(vec3(hL - hR, hD - hU, 0.12));
  vec2 off = n.xy * refr * 0.2;

  vec2 b = cover(uv);
  vec3 col = vec3(texture(photo, b + off * (1.0 - disp)).r,
                  texture(photo, b + off).g,
                  texture(photo, b + off * (1.0 + disp)).b);

  // colour of the light: white at noon, golden when the sun is low
  vec3 sunCol = mix(vec3(1.0, 0.97, 0.9), vec3(1.0, 0.7, 0.4), warmth);

  // caustics: light gathers where the surface is concave; stronger in sunlight
  float lap = hL + hR + hD + hU - 4.0 * h;
  float caus = clamp(lap * (6.0 + 46.0 * sun), -0.45, 1.4);
  col *= 1.0 + caus * 0.45;
  col += max(caus, 0.0) * sunCol * 0.32 * sun;

  // glints, aimed at the real sun position
  vec3 H = normalize(normalize(sunDir) + vec3(0, 0, 1));
  float glint = pow(max(dot(n, H), 0.0), mix(160.0, 700.0, sun));
  col += glint * sunCol * spec * (0.3 + 2.4 * sun) * (1.0 - night * 0.7);

  // DIRECT SUN: a moving net of light on the floor, bent by the ripples
  float direct = sun * (1.0 - cloud * 0.7) * (1.0 - night);
  vec2 cp = gl_FragCoord.xy / dpr / 105.0 + off * 18.0;
  float cn = caustics(cp, time * 0.6);
  col *= 1.0 - direct * 0.1;                               // a little contrast: floor between the lines dims
  col += sunCol * cn * direct * 0.3;
  col *= 1.0 + direct * 0.06;                               // exposure
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, 1.0 + direct * 0.3);           // richer colour in sunlight

  // the side facing the sun is a little brighter, and everything takes the light's colour
  vec2 sd = normalize(sunDir.xy + vec2(1e-4));
  col *= 1.0 + sun * 0.22 * dot(uv - 0.5, sd);
  col = mix(col, col * sunCol, clamp(sun * 0.25 + warmth * 0.4, 0.0, 0.6) * (1.0 - night));

  // soft glare from the corner the sun is in (warmer when the sun is low)
  vec2 sp = 0.5 + sd * 0.8;
  vec2 dv = (uv - sp) * vec2(aspect, 1.0);
  float glare = exp(-dot(dv, dv) * 3.0) * direct * (0.25 + 0.6 * warmth);
  col = 1.0 - (1.0 - col) * (1.0 - clamp(sunCol * glare * 0.55, 0.0, 1.0));

  // clouds wash the colour out a little; night is dim and blue
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, vec3(l) * vec3(0.95, 0.99, 1.04), cloud * cloud * 0.35);
  col = mix(col, col * vec3(0.36, 0.43, 0.6), night * 0.85);

  // grain, carried by the same refraction so it flows with the water
  vec2 gp = floor(gl_FragCoord.xy + off * res * 0.7);
  vec3 g = vec3(hash(gp), hash(gp + 17.3), hash(gp + 41.9));
  float mono = hash(gp + 7.1);
  vec3 grainy = col * (0.78 + 0.44 * mix(vec3(mono), g, 0.6)) + (g - 0.5) * 0.06;
  col = mix(col, grainy, grain);

  // gentle vignette
  vec2 v = uv - 0.5; col *= 1.0 - dot(v, v) * 0.22;

  // sun glitter: sharp HDR points + a bloom pyramid + diffraction streaks.
  // brighter glints spread further, so size comes from brightness, like a real photo.
  vec3 glow = texture(G, uv).rgb * 1.0
            + texture(B1, uv).rgb * 0.9 + texture(B2, uv).rgb * 1.3

  const ws = d ? d.wind : 0;
  // rain eases in gently but stops quickly, so a dry city really is dry
  env.rain += (targetRain - env.rain) * (targetRain > env.rain ? 0.03 : 0.15);
  env.wind += (ws - env.wind) * P.ease;
  env.windX += (Math.sin(a) - env.windX) * P.ease;
  env.windY += (Math.cos(a) - env.windY) * P.ease;

  // light eases over a few seconds too
  const L = lightOf(source);
  for (const k of ['sun', 'warmth', 'cloud', 'night']) env[k] += (L[k] - env[k]) * 0.02;
  env.sx += (L.dir[0] - env.sx) * 0.02; env.sy += (L.dir[1] - env.sy) * 0.02; env.sz += (L.dir[2] - env.sz) * 0.02;

  // drops per second grows with the square root of precipitation; slow and sparse by default
  const rate = targetRain > 0 && env.rain > 0.02 ? Math.min(7, 0.35 + 1.4 * Math.sqrt(env.rain)) : 0;
  if (rate > 0) {
    nextDrop -= dt;
    while (nextDrop <= 0) {
      const big = Math.random() < 0.18;
      addDrop(Math.random(), Math.random(),
        big ? 0.03 + Math.random() * 0.02 : 0.012 + Math.random() * 0.016,
        (big ? 0.9 : 0.5) * (0.8 + Math.random() * 0.4) * (0.85 + Math.min(env.rain, 6) * 0.05));
      nextDrop += -Math.log(1 - Math.random()) / rate;
    }
  }
}

// ---------- sunlight ----------
// where the sun is in a city's sky right now (standard low-precision solar position)
function sunPosition(lat, lon, ms) {
  const rad = Math.PI / 180, d = ms / 86400000 - 10957.5;                       // days since J2000
  const g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const Lng = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(Lng), Math.cos(Lng));
  const dec = Math.asin(Math.sin(e) * Math.sin(Lng));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (gmst * 15 + lon) * rad - ra, phi = lat * rad;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(H)); // from north, clockwise
  return { alt, az };
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// sun 0..1, warmth (low sun), cloud 0..1, night 0..1, and a direction toward the sun
function lightOf(c) {
  if (!c || !c.data) return { sun: 0.3, warmth: 0, cloud: 0, night: 0, dir: [0.4, 0.6, 0.7], alt: 0.5 };
  const d = c.data, { alt, az } = sunPosition(c.lat, c.lon, Date.now());
  const up = Math.sin(alt), cloud = Math.min(1, (d.cloud ?? 0) / 100);
  const sun = d.sw != null ? Math.min(1, d.sw / 850) : Math.max(0, up) * (1 - 0.75 * cloud);  // measured radiation if we have it
  return { sun, cloud, night: 1 - smooth(-0.12, 0.05, up), warmth: up > -0.05 ? 1 - smooth(0.05, 0.55, up) : 0,
           dir: [Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.max(up, 0)], alt };
}
function lightText(c) {
  if (!c || !c.data) return '—';
  const L = lightOf(c), d = c.data;
  if (L.night > 0.6) return 'Night';
  if (d.sw != null) return Math.round(d.sw) + ' W/m²';
  return 'Sun ' + Math.round(L.alt * 180 / Math.PI) + '°';
}

// ---------- pointer: touching the water ----------
let pointerDown = false, lastPt = null, touched = false;
function uvFromEvent(e) { return [e.clientX / innerWidth, 1 - e.clientY / innerHeight]; }
canvas.addEventListener('pointerdown', e => {
  pointerDown = true; const [x, y] = uvFromEvent(e); lastPt = [e.clientX, e.clientY];
  addDrop(x, y, 0.04, 1.0);
  if (!touched) { touched = true; $('hint').classList.add('gone'); }
});
addEventListener('pointerup', () => { pointerDown = false; });
canvas.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  const dx = e.clientX - lastPt[0], dy = e.clientY - lastPt[1];
  if (dx * dx + dy * dy < 100) return;
  lastPt = [e.clientX, e.clientY];
  const [x, y] = uvFromEvent(e); addDrop(x, y, 0.022, 0.25);
});

// ---------- output 1: video (caption burned in) ----------
const comp = document.createElement('canvas'), cctx = comp.getContext('2d');
let recorder = null, chunks = [];
function drawCaption() {
  const w = comp.width, h = comp.height, s = h / 1000;
  cctx.drawImage(canvas, 0, 0, w, h);
  if (!source || !source.data) return;
  const d = source.data;
  cctx.save();
  cctx.shadowColor = 'rgba(0,0,0,.35)'; cctx.shadowBlur = 18 * s;
  cctx.fillStyle = 'rgba(243,245,244,.95)';
  cctx.font = `300 ${44 * s}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  cctx.fillText(source.name, 44 * s, h - 78 * s);
  cctx.font = `400 ${14 * s}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  cctx.fillStyle = 'rgba(243,245,244,.92)';
  cctx.fillText(`${localTime(source)} local   ·   ${d.precip.toFixed(1)} mm   ·   wind ${Math.round(d.wind)} km/h   ·   ${WMO[d.code] ?? ''}   ·   ${lightText(source)}`, 46 * s, h - 44 * s);
  cctx.restore();
}
function toggleRecord() {
  if (recorder) { recorder.stop(); return; }
  comp.width = Math.min(canvas.width, 1920); comp.height = Math.round(comp.width * canvas.height / canvas.width);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mimeType) { toast('Recording is not supported in this browser'); return; }
  recorder = new MediaRecorder(comp.captureStream(60), { mimeType, videoBitsPerSecond: 16e6 });
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    download(new Blob(chunks, { type: mimeType }), `rain-from-elsewhere-${stamp()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`);
    recorder = null; $('bRec').classList.remove('on'); $('bRecLabel').textContent = 'Record'; toast('Video saved');
  };
  recorder.start(250);
  $('bRec').classList.add('on'); $('bRecLabel').textContent = 'Stop';
}

// ---------- output 2: time as height ----------
// every few frames the wave crests are read back as a binary layer;
// layers stack upward, so an expanding ripple becomes a cone.
const LAYER_EVERY = 4, LAYER_MAX = 300, CREST = 0.035;
let capturing = false, layers = [], layerW = 0, layerH = 0;
const readBuf = new Uint8Array(READ_W * 512 * 4);
function captureLayer() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, readT.fb); gl.viewport(0, 0, READ_W, READ_H);
  gl.useProgram(readProg.pr);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim[0].tex); gl.uniform1i(readProg.u.s, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, READ_W, READ_H, gl.RGBA, gl.UNSIGNED_BYTE, readBuf);
  const thr = Math.round((CREST * 1.5 + 0.5) * 255);
  const m = new Uint8Array(READ_W * READ_H);
  for (let i = 0; i < m.length; i++) m[i] = readBuf[i * 4] > thr ? 1 : 0;
  layers.push(m); layerW = READ_W; layerH = READ_H;
  $('bLayers').textContent = `Capturing ${layers.length}`;
  if (layers.length >= LAYER_MAX) toggleCapture();
}
function toggleCapture() {
  capturing = !capturing;
  if (capturing) { layers = []; toast('Capturing layers — let it rain for a while'); }
  $('bLayers').classList.toggle('on', capturing);
  $('bLayers').textContent = capturing ? 'Capturing 0' : (layers.length ? `${layers.length} layers` : 'Capture layers');
  $('bExport').disabled = capturing || !layers.length;
}
function exportOBJ() {
  if (!layers.length) return;
  const W = layerW, H = layerH, L = layers.length, cell = 1, dz = 0.5;
  const filled = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < W && y < H && z < L && layers[z][y * W + x] === 1;
  const verts = [], faces = [], map = new Map();
  const v = (x, y, z) => { const k = x + (W + 1) * (y + (H + 1) * z); let i = map.get(k);
    if (i === undefined) { verts.push(`v ${(x * cell).toFixed(1)} ${(z * dz).toFixed(2)} ${(y * cell).toFixed(1)}`); i = verts.length; map.set(k, i); } return i; };
  const quad = (a, b, c, d) => faces.push(`f ${a} ${b} ${c} ${d}`);
  for (let z = 0; z < L; z++) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!filled(x, y, z)) continue;
    if (!filled(x - 1, y, z)) quad(v(x, y, z), v(x, y, z + 1), v(x, y + 1, z + 1), v(x, y + 1, z));
    if (!filled(x + 1, y, z)) quad(v(x + 1, y, z), v(x + 1, y + 1, z), v(x + 1, y + 1, z + 1), v(x + 1, y, z + 1));
    if (!filled(x, y - 1, z)) quad(v(x, y, z), v(x + 1, y, z), v(x + 1, y, z + 1), v(x, y, z + 1));
    if (!filled(x, y + 1, z)) quad(v(x, y + 1, z), v(x, y + 1, z + 1), v(x + 1, y + 1, z + 1), v(x + 1, y + 1, z));
    if (!filled(x, y, z - 1)) quad(v(x, y, z), v(x, y + 1, z), v(x + 1, y + 1, z), v(x + 1, y, z));
    if (!filled(x, y, z + 1)) quad(v(x, y, z + 1), v(x + 1, y, z + 1), v(x + 1, y + 1, z + 1), v(x, y + 1, z + 1));
  }
  const head = `# Rain from Elsewhere — time as height\n# source: ${source ? source.name : ''}\n# layers: ${L}, grid ${W}x${H}\n`;
  download(new Blob([head, verts.join('\n'), '\n', faces.join('\n')], { type: 'text/plain' }), `rain-layers-${stamp()}.obj`);
  toast(`Exported ${L} layers`);
}

// ---------- helpers ----------
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function stamp() { return new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-'); }

// ---------- controls ----------
$('bRec').onclick = toggleRecord;
$('bLayers').onclick = toggleCapture;
$('bExport').onclick = exportOBJ;
$('bPhoto').onclick = () => $('file').click();
$('bFloor').onclick = () => setFloor(floorIndex + 1);
$('sRefr').oninput = e => P.refraction = +e.target.value;
$('sGrain').oninput = e => P.grain = +e.target.value;
$('sSpark').oninput = e => P.sparkle = +e.target.value;
$('file').onchange = e => e.target.files[0] && loadPhoto(e.target.files[0]);
function loadPhoto(f) { const img = new Image(); img.onload = () => { setPhoto(img); usingPhoto = true; $('bFloor').textContent = 'Floor · Photo'; toast('Photo placed under the water'); }; img.src = URL.createObjectURL(f); }
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadPhoto(f); });
let paused = false;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') $('ui').classList.toggle('hidden');
  else if (k === 'r') toggleRecord();
  else if (k === 'l') toggleCapture();
  else if (k === 'e') exportOBJ();
  else if (k === 'o') $('file').click();
  else if (k === 'f') setFloor(floorIndex + 1);
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
});

// ---------- main loop ----------
let frame = 0, last = performance.now(), time = 0;
const dropArr = new Float32Array(16 * 4);
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    time += dt;
    updateEnv(dt);

    // drift: up to ~0.35 texel/step in strong wind; ruffle grows with wind speed
    const w = Math.min(env.wind, 50) / 50;
    const drift = [env.windX * w * 0.35, env.windY * w * 0.35];
    const ruffle = 0.00006 + w * 0.0005;

    gl.useProgram(simProg.pr);
    gl.uniform2f(simProg.u.texel, 1 / simW, 1 / simH);
    gl.uniform1f(simProg.u.aspect, aspect);
    gl.uniform1f(simProg.u.damping, P.damping);
    gl.uniform1f(simProg.u.time, time);
    gl.uniform1f(simProg.u.ruffle, ruffle);
    gl.uniform2f(simProg.u.drift, drift[0], drift[1]);
    gl.viewport(0, 0, simW, simH);
    for (let i = 0; i < P.stepsPerFrame; i++) {
      const n = i === 0 ? pending.length : 0;
      for (let j = 0; j < n; j++) dropArr.set(pending[j], j * 4);
      gl.uniform1i(simProg.u.dropCount, n);
      if (n) gl.uniform4fv(simProg.u.drops, dropArr);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sim[1].fb);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim[0].tex); gl.uniform1i(simProg.u.s, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      sim.reverse();
    }
    pending.length = 0;
    if (capturing && frame % LAYER_EVERY === 0) captureLayer();
    frame++;
  }

  // glints -> bloom pyramid -> streaks
  const H3 = [env.sx, env.sy, Math.max(0.15, env.sz)];
  gl.bindFramebuffer(gl.FRAMEBUFFER, glintT.fb); gl.viewport(0, 0, glintT.w, glintT.h);
  gl.useProgram(glintProg.pr);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim[0].tex); gl.uniform1i(glintProg.u.s, 0);
  gl.uniform2f(glintProg.u.texel, 1 / simW, 1 / simH);
  gl.uniform2f(glintProg.u.res, canvas.width, canvas.height);
  gl.uniform1f(glintProg.u.time, time); gl.uniform1f(glintProg.u.dpr, canvas.width / innerWidth);
  gl.uniform1f(glintProg.u.sun, env.sun); gl.uniform1f(glintProg.u.night, env.night); gl.uniform1f(glintProg.u.warmth, env.warmth);
  gl.uniform1f(glintProg.u.sparkle, P.sparkle);
  gl.uniform3f(glintProg.u.sunDir, H3[0], H3[1], H3[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(downProg.pr); gl.uniform1i(downProg.u.t, 0);
  let src = glintT;
  for (const dst of bloomT) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.uniform2f(downProg.u.tx, 1 / src.w, 1 / src.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3); src = dst;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, starT.fb); gl.viewport(0, 0, starT.w, starT.h);
  gl.useProgram(starProg.pr); gl.uniform1i(starProg.u.t, 0);
  gl.bindTexture(gl.TEXTURE_2D, bloomT[1].tex); gl.uniform2f(starProg.u.tx, 1 / bloomT[1].w, 1 / bloomT[1].h);
  gl.uniform1f(starProg.u.thr, 0.12);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(renderProg.pr);
  [glintT, ...bloomT, starT].forEach((t, i) => { gl.activeTexture(gl.TEXTURE2 + i); gl.bindTexture(gl.TEXTURE_2D, t.tex); });
  ['G', 'B1', 'B2', 'B3', 'B4', 'ST'].forEach((n, i) => gl.uniform1i(renderProg.u[n], 2 + i));
  gl.uniform1f(renderProg.u.starAmt, 1.4);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim[0].tex); gl.uniform1i(renderProg.u.s, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, photoTex); gl.uniform1i(renderProg.u.photo, 1);
  gl.uniform2f(renderProg.u.texel, 1 / simW, 1 / simH);
  gl.uniform2f(renderProg.u.res, canvas.width, canvas.height);
  gl.uniform1f(renderProg.u.aspect, aspect);
  gl.uniform1f(renderProg.u.photoAspect, photoAspect);
  gl.uniform1f(renderProg.u.refr, P.refraction);
  gl.uniform1f(renderProg.u.disp, P.dispersion);
  gl.uniform1f(renderProg.u.grain, P.grain);
  gl.uniform1f(renderProg.u.spec, P.specular);
  gl.uniform1f(renderProg.u.sun, env.sun);
  gl.uniform1f(renderProg.u.warmth, env.warmth);
  gl.uniform1f(renderProg.u.cloud, env.cloud);
  gl.uniform1f(renderProg.u.night, env.night);
  gl.uniform1f(renderProg.u.time, time);
  gl.uniform1f(renderProg.u.dpr, canvas.width / innerWidth);
  gl.uniform1f(renderProg.u.sparkle, P.sparkle);
  gl.uniform3f(renderProg.u.sunDir, env.sx, env.sy, Math.max(0.15, env.sz));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (recorder) drawCaption();
  requestAnimationFrame(step);
}
// if media/floor.jpg exists next to this page, it becomes the floor automatically
// (works when the page is served, e.g. Live Server or GitHub Pages)
const autoFloor = new Image();
autoFloor.onload = () => { try { setPhoto(autoFloor); usingPhoto = true; $('bFloor').textContent = 'Floor · Photo'; } catch (e) { /* file:// pages can't use local images in WebGL */ } };
autoFloor.src = 'media/floor.jpg';

renderList();
refresh();
requestAnimationFrame(step);
</script>
</body>
</html>
